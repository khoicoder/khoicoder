name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *" # Chạy mỗi 12 giờ để cập nhật dữ liệu mới nhất
  workflow_dispatch:
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.1.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # Tùy chỉnh màu sắc: Rắn hồng (#ff69b4) và các ô đóng góp theo tông hồng nhạt đến đậm
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff69b4&color_dots=#ebedf0,#ffc0cb,#ffb6c1,#ff69b4,#ff1493
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff69b4&color_dots=#161b22,#50223e,#7e2a58,#b93a7e,#ff69b4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
